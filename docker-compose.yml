services:
  # ==================================================
  # 1. MongoDB Database
  # ==================================================
  mongodb:
    image: mongo:7.0
    container_name: localkart-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - localkart-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================================================
  # 2. Redis In-Memory Cache
  # ==================================================
  redis:
    image: redis:7.2-alpine
    container_name: localkart-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - localkart-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================================================
  # 3. Backend Instance 1 (Horizontal Scaling)
  # ==================================================
  backend1:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: localkart-backend1
    restart: unless-stopped
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-instance-1
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/localkart
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=localkart_jwt_super_secret_access_key_2026
      - JWT_REFRESH_SECRET=localkart_jwt_super_secret_refresh_key_2026
      - PLATFORM_COMMISSION_PERCENTAGE=5
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - localkart-net

  # ==================================================
  # 4. Backend Instance 2 (Horizontal Scaling)
  # ==================================================
  backend2:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: localkart-backend2
    restart: unless-stopped
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-instance-2
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/localkart
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=localkart_jwt_super_secret_access_key_2026
      - JWT_REFRESH_SECRET=localkart_jwt_super_secret_refresh_key_2026
      - PLATFORM_COMMISSION_PERCENTAGE=5
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - localkart-net

  # ==================================================
  # 5. Frontend Client Container
  # ==================================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: localkart-frontend
    restart: unless-stopped
    networks:
      - localkart-net

  # ==================================================
  # 6. Nginx Reverse Proxy & Load Balancer
  # ==================================================
  nginx:
    image: nginx:alpine
    container_name: localkart-load-balancer
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - frontend
    networks:
      - localkart-net

networks:
  localkart-net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
